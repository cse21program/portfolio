name: portfolio

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-security: &security
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: *logging

services:
  nginx:
    <<: *security
    image: nginx:1.27-alpine
    container_name: portfolio-nginx
    mem_limit: 64m
    read_only: true
    tmpfs:
      - /var/run
      - /var/cache/nginx
      - /tmp
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - edge
      - app

  backend:
    <<: *security
    image: ${DOCKER_IMAGE}:${IMAGE_TAG:-latest}
    container_name: portfolio-api
    mem_limit: 768m
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: /api/v1
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      S3_UPLOADS_BUCKET: ${S3_UPLOADS_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_EC2_METADATA_V1_DISABLED: "true"
      AWS_METADATA_SERVICE_TIMEOUT: "1"
      AWS_METADATA_SERVICE_NUM_ATTEMPTS: "2"
      CORS_ORIGIN: ${FRONTEND_ORIGIN}
      FRONTEND_URL: ${FRONTEND_ORIGIN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      COOKIE_SECURE: "true"
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    volumes:
      - uploads_data:/app/uploads
    networks:
      - app
      - data

  postgres:
    <<: *security
    image: postgres:16-alpine
    container_name: portfolio-postgres
    mem_limit: 512m
    shm_size: 64mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data

  redis:
    <<: *security
    image: redis:7-alpine
    container_name: portfolio-redis
    mem_limit: 128m
    read_only: true
    tmpfs:
      - /tmp
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru
      - --protected-mode
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - data

networks:
  edge:
  app:
    internal: false
  data:
    internal: true

volumes:
  postgres_data:
  redis_data:
  uploads_data:
